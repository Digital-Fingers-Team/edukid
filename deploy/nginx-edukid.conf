# EduKid — home stuttering support + early learning (github.com/Digital-Fingers-Team/edukid)
# Lives in ~/pricelens/docker/nginx-upstreams/edukid.conf on the pricelens server; pricelens-proxy
# runs in the host network, so the upstream is a loopback port (pm2 `edukid-api`, which also
# serves the built web app and /books/).

limit_req_zone $binary_remote_addr zone=edukid_auth:1m rate=20r/m;

server {
    listen 80;
    server_name edukid.130-110-124-121.sslip.io;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name edukid.130-110-124-121.sslip.io;

    ssl_certificate     /etc/letsencrypt/live/edukid.130-110-124-121.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/edukid.130-110-124-121.sslip.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "microphone=(self), camera=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; media-src 'self' blob:; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self'; frame-src https://www.youtube-nocookie.com; script-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'" always;

    client_max_body_size 12m;   # speech-sample uploads are capped at 10 MB by the API

    location /api/auth/ {
        limit_req zone=edukid_auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:4410;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:4410;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
